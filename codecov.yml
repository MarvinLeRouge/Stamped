flag_management:
  default_rules:
    ignore:
      - "**/main.{ts,py}"
      - "**/index.ts"
      - "**/App.vue"
      - "**/*.d.ts"
      - "**/types/**"
      - "**/constants/**"
      - "**/migrations/**"
      - "**/__init__.py"

flags:
  frontend:
    paths:
      - frontend/src/
    carryforward: true
    ignore:
      - "**/main.ts"
      - "**/App.vue"
      - "**/router/index.ts"
      - "**/*.d.ts"
      - "**/types/**"
      - "**/assets/**"

  backend:
    paths:
      - backend/
    carryforward: true
    ignore:
      - "**/main.py"
      - "**/__init__.py"
      - "**/migrations/**"

coverage:
  status:
    project:
      default:
        enabled: true
        target: 90%
        threshold: 1%
        informational: false
    patch:
      default:
        enabled: true
        target: 80%
        threshold: 5%
        informational: false

comment:
  layout: reach,diff,flags,files
  behavior: default
  require_changes: true
