[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stamped"
version = "0.1.0"
description = "Your outdoor photos on a conquest map. Fully private, nothing leaves your machine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
    "sqlmodel>=0.0.48",
    "click>=8.5.1",
    "exifread>=3.5.1",
    "piexif>=1.1.3",
    "Pillow>=13.0.0",
    "gpxpy>=1.6.2",
    "geopy>=2.5.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.33",
    "sse-starlette>=3.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "types-Pillow",
    "pre-commit>=4.7.0",
    "pip-audit>=2.10.1",
]

[project.scripts]
stamped = "stamped.cli:cli"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["frontend/", "data/", ".venv/"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stamped"]

[tool.coverage.run]
source = ["backend/stamped"]
omit = ["backend/tests/*", "backend/stamped/migrations/*", "backend/stamped/cli.py"]
relative_files = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "pragma: no cover"]
