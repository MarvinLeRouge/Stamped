[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stamped"
version = "0.1.0"
description = "Your outdoor photos on a conquest map. Fully private, nothing leaves your machine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "click>=8.1",
    "exifread>=3.0",
    "piexif>=1.1",
    "Pillow>=11.0",
    "gpxpy>=1.6",
    "geopy>=2.4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.11",
    "types-Pillow",
    "pre-commit>=4.0",
]

[project.scripts]
stamped = "stamped.cli:cli"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["frontend/", "data/", ".venv/"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stamped"]

[tool.coverage.run]
source = ["backend/stamped"]
omit = ["backend/tests/*", "backend/stamped/migrations/*"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "pragma: no cover"]
